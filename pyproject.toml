[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ibtrader"
version = "0.1.0"
description = "Turnover Top1 overnight US equity trader for IB Gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6,<7",
  "exchange-calendars>=4.5,<5",
  "ib-async>=2.0,<3",
  "httpx>=0.27,<1",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1"]

[project.scripts]
ibtrader = "ibtrader.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/ibtrader"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
