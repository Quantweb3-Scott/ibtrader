services:
  ibtrader:
    build: .
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./sharedata:/app/sharedata
    healthcheck:
      test: ["CMD", "uv", "run", "--frozen", "--no-dev", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/api/status')"]
      interval: 30s
      timeout: 5s
      retries: 3
